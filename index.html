 if(i===1){const hr=new THREE.Mesh(SG,M(c.hair));hr.scale.set(.46,.3,.46);hr.position.set(0,1.7,.02);vis.add(hr);const bn=new THREE.Mesh(SG,M(c.hair));bn.scale.set(.32,.32,.32);bn.position.set(0,1.98,.04);vis.add(bn);
  B(.09,.55,.09,c.hair,-.22,1.3,.08,vis);B(.09,.55,.09,c.hair,.22,1.3,.08,vis);B(.04,.1,.04,0xf4c542,-.23,1.47,-.05,vis);B(.04,.1,.04,0xf4c542,.23,1.47,-.05,vis)}
 if(i===2){const hr=new THREE.Mesh(SG,M(c.hair));hr.scale.set(.5,.34,.5);hr.position.set(0,1.72,0);vis.add(hr);
  for(let k=0;k<7;k++){const a=k*.9;B(.07,.2,.07,c.hair,Math.cos(a)*.24,1.82+Math.sin(k)*.04,Math.sin(a)*.24,vis)}
  B(.07,.72,.36,0x1a1a1a,.08,1,0,vis);B(.2,.24,.1,0x1a1a1a,-.3,.78,-.02,vis)}
 aL=limb(-.38,1.28,1,c,i);aR=limb(.38,1.28,1,c,i);lL=limb(-.14,.7,0,c,i);lR=limb(.14,.7,0,c,i)}
function sv(){try{localStorage.setItem('nr_bank',bank);localStorage.setItem('nr_unl',unl);localStorage.setItem('nr_ch',sel)}catch(e){}}
function cards(){document.querySelectorAll('.ch').forEach(d=>{const i=+d.dataset.i,u=unl&(1<<i);d.classList.toggle('on',sel===i&&!!u);d.querySelector('small').textContent=u?(sel===i?'Choisi':'Choisir'):COST[i]+' FCFA'});$('bk').textContent='FCFA : '+bank}
document.querySelectorAll('.ch').forEach(d=>d.onclick=()=>{const i=+d.dataset.i;if(unl&(1<<i)){build(i);sv();cards()}else if(bank>=COST[i]){bank-=COST[i];unl|=1<<i;build(i);sv();cards()}});
if(!(unl&(1<<sel)))sel=0;build(sel);cards();

// ---- état joueur
let lane=1,px=0,py=0,vy=0,sliding=false,slideT=0,dead=false,runT=0;
const hgt=()=>sliding?.7:1.7;
function swipe(d){if(state!=='play'||dead)return;
 if(d===0)lane=Math.max(0,lane-1);else if(d===1)lane=Math.min(2,lane+1);
 else if(d===2){if(py<=.001&&vy<=0){vy=9;sliding=false;beep(250,600,.15)}}
 else if(d===3){if(py<=.001&&vy<=0){sliding=true;slideT=.7}else vy=-16}}

// ---- obstacles
let items=[];
function mk(t){const g=new THREE.Group();
 if(t===0){B(1.5,.1,.5,0x8b5a2b,0,.55,0,g);B(.1,.55,.1,0x6b4423,-.65,.27,0,g);B(.1,.55,.1,0x6b4423,.65,.27,0,g);B(1.3,.2,.4,0xe3c93a,0,.7,0,g);B(.5,.2,.35,0xff8c00,-.35,.9,0,g);B(.4,.15,.3,0x2f9e44,.4,.88,0,g)}
 if(t===1){B(.08,2.1,.08,0x6b4423,-.75,1.05,0,g);B(.08,2.1,.08,0x6b4423,.75,1.05,0,g);B(1.5,.03,.03,0x333333,0,2.02,0,g);B(.45,.65,.03,0xd62828,-.48,1.68,0,g);B(.45,.65,.03,0xf4a300,0,1.68,0,g);B(.45,.65,.03,0x2a6fdb,.48,1.68,0,g)}
 if(t===2){B(1.3,.4,1.2,0xe8dcc0,0,.2,0,g);B(1.2,.4,1.1,0xdacfae,0,.6,0,g);B(1.1,.4,1,0xe8dcc0,0,1,0,g);B(1.31,.08,.5,0x2a9d4a,0,.2,0,g)}
 if(t===3){B(1.5,2.3,6,0xf5f5f0,0,1.4,0,g);B(1.52,.35,5.9,0x1d9b4a,0,.9,0,g);B(1.52,.25,5.9,0xff8200,0,1.2,0,g);B(1.52,.6,4.6,0x2a3f55,0,2,-.2,g);B(1.2,.7,.05,0x2a3f55,0,1.9,3.01,g);B(.25,.2,.05,0xfff176,-.5,.8,3.01,g);B(.25,.2,.05,0xfff176,.5,.8,3.01,g);B(1.2,.35,2.4,0x8b5a2b,0,2.75,.6,g);[-.78,.78].forEach(x=>[-1.8,1.8].forEach(z=>B(.2,.6,.9,0x111111,x,.3,z,g)))}
 if(t===5){B(1.4,.7,3.6,0xe8541f,0,.65,0,g);B(1.2,.55,1.8,0xe8541f,0,1.25,-.1,g);B(1.22,.4,1.7,0x2a3f55,0,1.28,-.1,g);B(.5,.15,.25,0xffffff,0,1.6,0,g);[-.7,.7].forEach(x=>[-1.2,1.2].forEach(z=>B(.2,.5,.6,0x111111,x,.25,z,g)))}
 if(t===4){const m=new THREE.Mesh(CG,M(0xffd400));g.add(m)}
 return g}
const DEF=[[.75,.3,0,1],[.75,.2,1.35,2.05],[.65,.6,0,1.2],[.75,3,0,2.9],null,[.7,1.9,0,1.6]];
function put(t,l,z,y){const g=mk(t);g.position.set((l-1)*LW,y||0,z);S.add(g);
 const d=DEF[t]||[0,0,(y||0)-.3,(y||0)+.3];items.push({g,t,hx:d[0],hz:d[1],mn:d[2],mx:d[3]})}
function row(z){const hard=.18+.18*Math.min(1,(speed-12)/18);
 const cs=safe;let ns=cs;if(Math.random()<.35)ns=Math.max(0,Math.min(2,cs+(Math.random()<.5?-1:1)));
 const occ=[0,0,0];const r=Math.random();
 if(r<hard){let f=1;for(let l=0;l<3;l++){if(l===cs||l===ns)continue;if(f||Math.random()<.75){put((q=>q<.3?3:q<.55?5:2)(Math.random()),l,z);occ[l]=1;f=0}}}
 else if(r<hard+.24){let a=0;for(let l=0;l<3;l++)if(Math.random()<.6){put(0,l,z);occ[l]=1;a=1}if(!a){const l=Math.floor(Math.random()*3);put(0,l,z);occ[l]=1}}
 else if(r<hard+.38){let a=0;for(let l=0;l<3;l++)if(Math.random()<.5){put(1,l,z);occ[l]=1;a=1}if(!a){const l=Math.floor(Math.random()*3);put(1,l,z);occ[l]=1}}
 if(!occ[cs]&&Math.random()<.65)for(let k=-2;k<=2;k++)put(4,cs,z+k,.8);
 safe=ns}
function clearItems(){items.forEach(i=>S.remove(i.g));items=[]}

// ---- sons
let ac;function beep(f0,f1,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
 o.frequency.setValueAtTime(f0,ac.currentTime);o.frequency.linearRampToValueAtTime(f1,ac.currentTime+d);g.gain.setValueAtTime(.15,ac.currentTime);g.gain.linearRampToValueAtTime(0,ac.currentTime+d);
 o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

// ---- états
const show=(id,on)=>$(id).classList.toggle('on',on);
function menu(){state='menu';dead=false;lane=1;px=0;py=0;vy=0;sliding=false;clearItems();$('hud').style.display='none';show('menu',1);show('pause',0);show('over',0);$('mb').textContent='Meilleur : '+best;cards()}
function start(){clearItems();speed=12;score=0;scoreF=0;coins=0;rowAcc=-26;safe=1;dead=false;lane=1;px=0;py=0;vy=0;sliding=false;state='play';
 $('hud').style.display='block';show('menu',0);show('pause',0);show('over',0)}
function crash(){state='over';dead=true;bank+=coins;sv();beep(200,40,.5);let nb=score>best;if(nb){best=score;try{localStorage.setItem('nr_best',best)}catch(e){}}
 $('os').textContent='Score : '+score;$('ob').textContent=nb?'Nouveau record !':'Meilleur : '+best;show('over',1)}
$('play').onclick=start;$('again').onclick=start;$('mn1').onclick=menu;$('mn2').onclick=menu;
$('pb').onclick=()=>{if(state==='play'){state='pause';show('pause',1)}};
$('res').onclick=()=>{state='play';show('pause',0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'){state='pause';show('pause',1)}});

// ---- entrées
let sx,sy,tr=false;const cv=$('c');
function pd(x,y){sx=x;sy=y;tr=true}
function pm(x,y){if(!tr)return;const dx=x-sx,dy=y-sy;if(Math.hypot(dx,dy)>innerHeight*.04){tr=false;swipe(Math.abs(dx)>Math.abs(dy)?(dx<0?0:1):(dy<0?2:3))}}
cv.addEventListener('touchstart',e=>{e.preventDefault();pd(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();pm(e.touches[0].clientX,e.touches[0].clientY)},{passive:false});
cv.addEventListener('touchend',()=>{tr=false});
cv.addEventListener('mousedown',e=>pd(e.clientX,e.clientY));addEventListener('mousemove',e=>pm(e.clientX,e.clientY));addEventListener('mouseup',()=>{tr=false});
addEventListener('keydown',e=>{const k=e.key;
 if(k==='ArrowLeft'||k==='a')swipe(0);else if(k==='ArrowRight'||k==='d')swipe(1);else if(k==='ArrowUp'||k==='w'||k===' ')swipe(2);else if(k==='ArrowDown'||k==='s')swipe(3);
 else if(k==='Escape'){if(state==='play'){state='pause';show('pause',1)}else if(state==='pause'){state='play';show('pause',0)}}});

// ---- boucle
const clock=new THREE.Clock();
function update(dt){
 const sp=state==='play'?speed:(state==='menu'?6:0),dz=sp*dt;
 sleepers.forEach(m=>{m.position.z+=dz;if(m.position.z>10)m.position.z-=120});
 blds.forEach(b=>{b.position.z+=dz;if(b.position.z>20){b.position.z-=126;setH(b,4+Math.random()*5)}});
 deco.forEach(d=>{d.position.z+=dz;if(d.position.z>15)d.position.z-=168});
 gates.forEach(g=>{g.position.z+=dz;if(g.position.z>15)g.position.z-=180});
 if(state==='play'){
  speed=Math.min(speed+.15*dt,32);score+=0;
  scoreF+=speed*dt;score=Math.floor(scoreF);
  rowAcc+=dz;if(rowAcc>=12){rowAcc-=12;row(-110)}
 }
 // joueur
 const tx=(lane-1)*LW;if(!dead)px+=Math.sign(tx-px)*Math.min(Math.abs(tx-px),12*dt);
 if(py>0||vy>0){vy-=28*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
 if(sliding){slideT-=dt;if(slideT<=0)sliding=false}
 P.position.set(px,py,0);
 // items
 for(let i=items.length-1;i>=0;i--){const it=items[i];it.g.position.z+=dz;const z=it.g.position.z;
  if(z>10){S.remove(it.g);items.splice(i,1);continue}
  if(it.t===4)it.g.rotation.y+=220*Math.PI/180*dt;
  if(state!=='play')continue;
  const ddz=Math.abs(z),ddx=Math.abs(it.g.position.x-px),ymax=py+hgt();
  if(it.t!==4){if(ddz<it.hz+.3&&ddx<it.hx+.25&&ymax>it.mn+.03&&py<it.mx-.03){crash();break}}
  else if(ddz<.8&&ddx<.8&&ymax>it.mn&&py<it.mx){coins++;scoreF+=10;S.remove(it.g);items.splice(i,1);beep(900,1500,.1)}}
 if(state==='play'){$('sc').textContent='Score '+score;$('co').textContent='FCFA '+coins}
 // animation
 if(dead){vis.rotation.x+=(1.5-vis.rotation.x)*Math.min(1,10*dt);aL.rotation.x=aR.rotation.x=2}
 else if(sliding){vis.rotation.set(1.2,0,0);vis.position.set(0,.15,-.6);aL.rotation.x=aR.rotation.x=2.8;lL.rotation.x=lR.rotation.x=0}
 else{vis.position.set(0,0,0);
  if(py>.01){vis.rotation.set(0,0,0);aL.rotation.x=aR.rotation.x=2.6;lL.rotation.x=.7;lR.rotation.x=-.35}
  else{runT+=dt*(8+sp*.5);const s=Math.sin(runT);aL.rotation.x=s*.9;aR.rotation.x=-s*.9;lL.rotation.x=-s*.95;lR.rotation.x=s*.95;
   vis.position.y=Math.abs(Math.cos(runT))*.06;vis.rotation.set(0,(tx-px)*.26,(px-tx)*.14)}}
}
let scoreF=0;
function loop(){requestAnimationFrame(loop);update(Math.min(clock.getDelta(),.05));R.render(S,C)}
loop();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
